<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ndunda - Namibia Rental Marketplace</title>
    <meta name="description" content="Namibia&#39;s trusted rental marketplace for rooms and houses. Find your perfect space or list your property for free.">
    <meta name="author" content="Ndunda" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Ndunda_logo.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Ndunda" />
    <meta name="twitter:image" content="/Ndunda_logo.png">
    <link rel="icon" type="image/png" href="/Ndunda_logo.png">
    <meta property="og:title" content="Ndunda - Namibia Rental Marketplace">
  <meta name="twitter:title" content="Ndunda - Namibia Rental Marketplace">
  <meta property="og:description" content="Namibia&#39;s trusted rental marketplace for rooms and houses. Find your perfect space or list your property for free.">
  <meta name="twitter:description" content="Namibia&#39;s trusted rental marketplace for rooms and houses. Find your perfect space or list your property for free.">
  <script>
    (function () {
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderStartupError(title, detail) {
        var root = document.getElementById("root");
        if (!root || window.__NDUNDA_APP_STARTED__) return;

        root.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;background:#f8faf9;color:#102018;">' +
          '<div style="max-width:520px;text-align:center;border:1px solid #dbe7df;border-radius:12px;background:#fff;padding:24px;box-shadow:0 12px 30px rgba(16,32,24,0.08);">' +
          '<img src="/Ndunda_logo.png" alt="Ndunda" style="height:56px;width:auto;margin-bottom:18px;" />' +
          '<h1 style="font-size:22px;margin:0 0 8px;">' +
          escapeHtml(title) +
          '</h1><p style="font-size:14px;line-height:1.5;margin:0 0 14px;color:#52645a;">The page loaded, but the app bundle could not start.</p>' +
          '<pre style="white-space:pre-wrap;text-align:left;background:#f1f5f2;border-radius:8px;padding:12px;font-size:12px;line-height:1.4;color:#1f3328;">' +
          escapeHtml(detail) +
          "</pre></div></div>";
      }

      window.addEventListener(
        "error",
        function (event) {
          if (window.__NDUNDA_APP_STARTED__) return;

          var target = event.target;
          var tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
          if (tagName === "script" || tagName === "link") {
            renderStartupError("Ndunda asset failed to load", target.src || target.href || "Unknown asset");
            return;
          }

          renderStartupError("Ndunda could not start", event.message || "Unknown startup error");
        },
        true
      );

      window.addEventListener("unhandledrejection", function (event) {
        renderStartupError("Ndunda could not start", event.reason && event.reason.message ? event.reason.message : event.reason || "Unknown startup error");
      });

      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || window.__NDUNDA_APP_STARTED__) return;

        var message = root.querySelector("[data-startup-message]");
        if (message) {
          message.textContent = "Still loading. If this stays here, open the browser console and check for blocked JavaScript assets or deployment environment errors.";
        }
      }, 30000);
    })();
  </script>
</head>

  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;background:#f8faf9;color:#102018;">
        <div style="max-width:420px;text-align:center;">
          <img src="/Ndunda_logo.png" alt="Ndunda" style="height:56px;width:auto;margin-bottom:18px;" />
          <h1 style="font-size:22px;margin:0 0 8px;">Loading Ndunda</h1>
          <p data-startup-message style="font-size:14px;line-height:1.5;margin:0;color:#52645a;">
            If this message stays here, the app bundle did not start. Refresh once, then check the deployment environment variables.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
